# Spring Actuator
management.endpoints.access.default=${MANAGEMENT_ENDPOINTS_ACCESS_BY_DEFAULT:NONE}
management.endpoint.health.access=${MANAGEMENT_ENDPOINT_HEALTH_ACCESS:UNRESTRICTED}
management.endpoints.web.path-mapping.health= ${MANAGEMENT_ENDPOINTS_WEB_PATH_MAPPING_HEALTH:healthcheck}
management.endpoints.web.base-path=${MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:/presenters}
management.endpoints.web.exposure.include=health

management.endpoint.health.probes.enabled=false
management.health.livenessstate.enabled=false
management.health.readinessstate.enabled=false

internal.api.url=${INTERNAL_API_URL}

spring.mongodb.database=${MONGODB_NAME}
spring.mongodb.uri=${MONGO_URI}
# REFERENCE DATA YAML FILES
# These imports load the reference data under src/main/resources/data/ into the Spring Environment.
# The generated BiMap classes (see enum-generator-config.yaml) are @ConfigurationProperties beans whose
# prefixes match the root keys in these files, so each BiMap is populated from the matching file.
# Every source YAML listed in enum-generator-config.yaml must be imported here: a missing import is not an error,
# the BiMap bean is simply created empty and lookups silently return nothing.
# Imports are deliberately not "optional:", so a missing or misnamed file fails startup.
# When adding a new data file, append the next index (spring.config.import[n]).
spring.config.import[0]=classpath:data/form-type-by-form-group.yaml
spring.config.import[1]=classpath:data/presenter-type-by-form-group.yaml
spring.config.import[2]=classpath:data/delivery-statement-by-form-group.yaml
spring.config.import[3]=classpath:data/delivery-statement-by-presenter-type.yaml
spring.config.import[4]=classpath:data/verification-statement-by-presenter-type.yaml
spring.config.import[5]=classpath:data/association-statement-by-presenter-type.yaml
spring.config.import[6]=classpath:data/data-object-by-presenter-type.yaml
