# REFERENCE DATA YAML FILES
# These imports load the generated YAML resources into the Spring Environment.
# The generator wraps docs/statement-matrix-docs/ dictionaries in the root-keys configured
# in enum-generator-config.yaml and writes them to target/generated-resources/data/.
# The same root-keys drive the generated BiMap bindings.
# Imports are deliberately not "optional:", so a missing or misnamed file fails startup.
# When adding a new data file, append the next index (spring.config.import[n])
spring.config.import[0]=classpath:data/form-group-to-form.yaml
spring.config.import[1]=classpath:data/form-group-to-presenter-types.yaml
spring.config.import[2]=classpath:data/form-group-to-delivery-statement.yaml
spring.config.import[3]=classpath:data/presenter-type-to-delivery-statement.yaml
spring.config.import[4]=classpath:data/presenter-type-to-verification-statement.yaml
spring.config.import[5]=classpath:data/presenter-type-to-assoc-statement.yaml
spring.config.import[6]=classpath:data/presenter-type-to-data-obj.yaml
